[package]
name = "ffmpeg-ui-desktop"
version = "2.0.0"
description = "Cross-platform native desktop media converter powered by FFmpeg and Tauri v2"
authors = ["Benny Pepper"]
license = "MIT"
repository = "https://github.com/bennypepper/FFmpeg-UI"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
sha2 = "0.10"
hex = "0.4"
ureq = "3"
tauri = { version = "2.10.3", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
